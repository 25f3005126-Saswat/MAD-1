{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="w-100" style="max-width: 440px;">
        <div class="card auth-card shadow-sm">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-primary mb-2">Exam Management Portal</h3>
                    <h4 class="fw-bold text-dark mb-1">Welcome</h4>
                    <p class="text-muted small">Sign in to your account</p>
                </div>

                <form method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Username</label>
                        <div class="input-group auth-input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="e.g. admin or roll number" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group auth-input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="password" name="password" id="passwordInput" class="form-control border-start-0 border-end-0 ps-0" placeholder="Enter your password" required>
                            <button class="btn password-toggle-btn border border-start-0" type="button" id="togglePasswordBtn" title="Toggle password visibility">
                                <i class="bi bi-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-semibold auth-btn shadow-sm">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Don't have an account? 
                        <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('passwordInput');
    const pwdIcon = document.getElementById('togglePasswordIcon');

    if (toggleBtn && pwdInput && pwdIcon) {
        toggleBtn.addEventListener('click', function () {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.classList.remove('bi-eye');
                pwdIcon.classList.add('bi-eye-slash');
            } else {
                pwdInput.type = 'password';
                pwdIcon.classList.remove('bi-eye-slash');
                pwdIcon.classList.add('bi-eye');
            }
        });
    }
</script>
{% endblock %}
