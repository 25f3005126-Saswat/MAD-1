{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title mb-3">Edit Slot</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" value="{{ slot.date }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Start Time</label>
                        <input type="time" name="start_time" value="{{ slot.start_time.strftime('%H:%M') }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">End Time</label>
                        <input type="time" name="end_time" value="{{ slot.end_time.strftime('%H:%M') }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Capacity</label>
                        <input type="number" name="capacity" value="{{ slot.capacity }}" class="form-control" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Update Slot</button>
                </form>
                <a href="{{ url_for('examiner_dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
