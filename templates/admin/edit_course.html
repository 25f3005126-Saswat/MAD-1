{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="card-title mb-0">Edit Course</h4>
                    <a href="{{ url_for('manage_courses') }}" class="btn btn-outline-secondary btn-sm">&larr; Back to Courses</a>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Course Code</label>
                        <input type="text" name="code" value="{{ course.code }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Course Name</label>
                        <input type="text" name="name" value="{{ course.name }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ course.description or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="Active" {% if course.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if course.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Course</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
