{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="card-title mb-0">Edit Examination</h4>
                    <a href="{{ url_for('manage_exams') }}" class="btn btn-outline-secondary btn-sm">&larr; Back to Exams</a>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <select name="course_id" class="form-select" required>
                            {% for course in courses %}
                                <option value="{{ course.id }}" {% if course.id == exam.course_id %}selected{% endif %}>
                                    {{ course.code }} - {{ course.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Exam Name</label>
                        <input type="text" name="name" value="{{ exam.name }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Exam Type</label>
                        <select name="exam_type" class="form-select" required>
                            <option value="Viva" {% if exam.exam_type == 'Viva' %}selected{% endif %}>Viva</option>
                            <option value="Practical" {% if exam.exam_type == 'Practical' %}selected{% endif %}>Practical</option>
                            <option value="Project Demo" {% if exam.exam_type == 'Project Demo' %}selected{% endif %}>Project Demo</option>
                            <option value="Assessment" {% if exam.exam_type == 'Assessment' %}selected{% endif %}>Assessment</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Duration (Minutes)</label>
                            <input type="number" name="duration_minutes" value="{{ exam.duration_minutes }}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Max Marks</label>
                            <input type="number" name="max_marks" value="{{ exam.max_marks }}" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Slot Creation Start</label>
                            <input type="datetime-local" name="slot_start" value="{{ exam.slot_start.strftime('%Y-%m-%dT%H:%M') }}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Slot Creation End</label>
                            <input type="datetime-local" name="slot_end" value="{{ exam.slot_end.strftime('%Y-%m-%dT%H:%M') }}" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Booking Start</label>
                            <input type="datetime-local" name="booking_start" value="{{ exam.booking_start.strftime('%Y-%m-%dT%H:%M') }}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Booking End</label>
                            <input type="datetime-local" name="booking_end" value="{{ exam.booking_end.strftime('%Y-%m-%dT%H:%M') }}" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status (Open / Close Controls)</label>
                        <select name="status" class="form-select">
                            <option value="Draft" {% if exam.status == 'Draft' %}selected{% endif %}>Draft</option>
                            <option value="Slot Creation" {% if exam.status == 'Slot Creation' %}selected{% endif %}>Slot Creation (Examiners can create slots)</option>
                            <option value="Booking Open" {% if exam.status == 'Booking Open' %}selected{% endif %}>Booking Open (Students can book slots)</option>
                            <option value="Closed" {% if exam.status == 'Closed' %}selected{% endif %}>Closed</option>
                            <option value="Completed" {% if exam.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
